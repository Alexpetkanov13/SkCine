[versions]
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
paper = "1.21.11-R0.1-SNAPSHOT"
skript = "2.16.2"
packetevents = "2.14.0"
junit = "5.14.4"
shadow = "9.6.1"
ktlint-gradle = "14.2.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
skript = { module = "com.github.SkriptLang:Skript", version.ref = "skript" }
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
