name: compatibility

# Real-server integration tests (Paper + Skript + headless clients). Manual or weekly; downloads ~60 MB per row.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { paper: '1.21.11', skript: '2.16.2', java: '21', client: '1.21.11' }
          - { paper: '1.21.11', skript: '2.17.0', java: '21', client: '1.21.11' }
          - { paper: '1.21.4',  skript: '2.16.2', java: '21', client: '1.21.4' }
          - { paper: '26.1.2',  skript: '2.17.0', java: '25', client: '26.1' }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Integration suites
        shell: powershell
        run: >
          integration-tests\run-integration.ps1 -Paper ${{ matrix.paper }} -Skript ${{ matrix.skript }}
          -Java "${{ steps.java.outputs.path }}\bin\java.exe" -ClientVersion ${{ matrix.client }} -Crash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log-${{ matrix.paper }}-${{ matrix.skript }}
          path: integration-tests/work/*/server.log
