name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (compile, ktlint, unit tests, shaded JAR)
        run: bash ./gradlew clean build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: SkCine-jar
          path: build/libs/SkCine-*.jar
