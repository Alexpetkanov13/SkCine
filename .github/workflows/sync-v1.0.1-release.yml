name: Sync SkCine v1.0.1 release description

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-v1.0.1-release.yml"
      - "release-notes/1.0.1.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Update existing GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("release-notes/1.0.1.md", "utf8");
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: "1.0.1",
            });
            if ((release.body || "").replace(/\r\n/g, "\n").trim() === body.trim()) {
              core.info("Release description is already up to date.");
            } else {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                body,
              });
              core.info("Updated SkCine 1.0.1 release description with the live bStats graph.");
            }
